<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>오메가기문</title>
<meta name="description" content="친구들이랑 링크 하나로 바로 하는 개웃긴 게임 모음">
<meta name="theme-color" content="#7fd0ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<style>
:root{
  --sky:#7fd0ff; --sky2:#5bb6f5; --ink:#1b2350; --pop:#ff4f8b; --sun:#ffd23f;
  --mint:#33d69f; --paper:#ffffff; --soft:#eef7ff; --muted:#5b6690;
  --r-big:24px; --r-mid:16px; --r-small:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"IBM Plex Sans KR",system-ui,sans-serif;color:var(--ink);
  background-color:var(--sky);
  background-image:
    radial-gradient(circle at 12px 12px, rgba(255,255,255,.55) 3px, transparent 3.5px),
    radial-gradient(circle at 36px 30px, rgba(255,79,139,.35) 2.5px, transparent 3px),
    radial-gradient(circle at 24px 44px, rgba(255,210,63,.6) 2.5px, transparent 3px);
  background-size:48px 52px;
  overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
.hidden{display:none!important}

/* 공통 부품 */
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-big);box-shadow:6px 6px 0 var(--ink);padding:22px}
.btn{
  font-family:"Jua",sans-serif;font-size:20px;line-height:1;cursor:pointer;
  background:var(--sun);border:3px solid var(--ink);border-radius:var(--r-mid);
  padding:14px 20px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.pop{background:var(--pop);color:#fff}
.btn.mint{background:var(--mint)}
.btn.plain{background:var(--paper)}
.btn.small{font-size:16px;padding:9px 14px;box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{width:100%;border:3px solid var(--ink);border-radius:var(--r-mid);padding:13px 14px;background:var(--soft);font-size:18px}
.field::placeholder{color:#8a93b8}
label.lbl{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}

/* 메인 */
.main-wrap{max-width:1120px;margin:0 auto;padding:40px 20px 60px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
.title{font-family:"Jua",sans-serif;font-size:clamp(64px,11vw,132px);line-height:.95;margin:10px 0 14px;display:flex;flex-wrap:wrap;user-select:none}
.title span{
  display:inline-block;color:var(--c);cursor:pointer;
  text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),4px 5px 0 var(--ink);
  animation:drop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*70ms);
  transform-origin:50% 100%;
}
.title span.squish{animation:squish .5s ease}
@keyframes drop{0%{transform:translateY(-120px) scale(.8,1.2);opacity:0}60%{transform:translateY(0) scale(1.2,.8);opacity:1}100%{transform:none}}
@keyframes squish{0%{transform:none}30%{transform:scale(1.25,.7)}60%{transform:scale(.85,1.2) translateY(-14px)}100%{transform:none}}
.tagline{font-size:19px;max-width:30em;margin:0 0 26px;font-weight:600}
.join{display:grid;gap:16px;max-width:460px}
.join-row{display:flex;gap:10px}
.join-row .field{flex:1;text-transform:uppercase;letter-spacing:.2em;font-family:"Jua",sans-serif;font-size:22px}
.or{font-size:14px;color:var(--muted);text-align:center;margin:-4px 0}
.err{color:#d6204f;font-weight:700;font-size:14px;min-height:1em;margin:0}

.shelf h2{font-family:"Jua",sans-serif;font-weight:400;font-size:28px;margin:6px 0 14px}
.tickets{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ticket{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-mid);padding:12px 14px}
.ticket .ico{width:56px;height:56px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;font-size:28px;background:var(--bg)}
.ticket b{font-family:"Jua",sans-serif;font-weight:400;font-size:21px;display:block}
.ticket small{color:var(--muted);font-size:14px}
.tag{font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--soft)}
.tag.live{background:var(--mint)}
.ticket.soon{opacity:.62}
.ticket.pick{cursor:pointer}
.ticket.pick[aria-pressed="true"]{background:#fff6cf;box-shadow:4px 4px 0 var(--ink)}

.sound{position:fixed;right:14px;top:14px;z-index:50;display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 12px 6px 6px;box-shadow:3px 3px 0 var(--ink)}
.sound button{width:36px;height:36px;border-radius:50%;border:none;background:var(--sun);cursor:pointer;font-size:17px}
.sound input{width:90px;accent-color:var(--pop)}

/* 대기실 */
.lobby-wrap{max-width:1040px;margin:0 auto;padding:30px 20px 60px}
.lobby-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px;padding-right:200px}
.code{display:flex;gap:8px;align-items:center}
.code .cap{font-weight:700;margin-right:6px}
.code span.tile{font-family:"Jua",sans-serif;font-size:40px;width:56px;height:64px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-small);box-shadow:3px 3px 0 var(--ink)}
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.lobby-grid h2{font-family:"Jua",sans-serif;font-weight:400;font-size:24px;margin:0 0 12px}
.plist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.plist li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-small);background:var(--soft)}
.blob{width:34px;height:38px;border-radius:50% 50% 44% 44%;border:3px solid var(--ink);background:var(--c);position:relative;flex:none}
.blob::before,.blob::after{content:"";position:absolute;top:11px;width:5px;height:7px;border-radius:3px;background:var(--ink)}
.blob::before{left:8px}.blob::after{right:8px}
.plist .nm{font-weight:700;flex:1}
.pill{font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;background:var(--sun)}
.pill.bot{background:var(--soft)}
.pill.me{background:var(--mint)}
.botctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--pop)}
.start-area{margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wait{font-weight:700;color:var(--muted)}
.mine{margin-top:18px}

/* 게임 */
#game{position:fixed;inset:0;background:#9ad7ff;touch-action:none;user-select:none;-webkit-user-select:none}
#game canvas{display:block;width:100%;height:100%}
.hud-top{position:absolute;left:0;right:0;top:12px;display:flex;flex-direction:column;align-items:center;pointer-events:none;gap:8px}
.banner{font-family:"Jua",sans-serif;font-size:clamp(30px,6vw,60px);color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink);text-align:center;padding:0 12px}
.banner.bump{animation:bump .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{0%{transform:scale(.4)}100%{transform:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
.chip.ev{background:var(--sun)}
.feed{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:44vw}
.feed div{background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:10px;padding:5px 10px;font-size:14px;font-weight:600;animation:bump .3s}
.keys{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.9);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.7;pointer-events:none}
.keys kbd{font-family:inherit;font-weight:700;border:2px solid var(--ink);border-radius:6px;padding:0 5px;background:var(--soft)}
.gbtn{position:absolute;right:12px;top:12px;z-index:5}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(27,35,80,.35);z-index:8;padding:16px}
.overlay .panel{max-width:480px;width:100%;text-align:center}
.overlay h2{font-family:"Jua",sans-serif;font-weight:400;font-size:40px;margin:0 0 8px}
.awards{list-style:none;padding:0;margin:14px 0 20px;display:grid;gap:8px;text-align:left}
.awards li{background:var(--soft);border-radius:var(--r-small);padding:8px 12px}
.awards b{font-family:"Jua",sans-serif;font-weight:400;font-size:18px;margin-right:6px}
.replay-tag{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--pop);color:#fff;font-family:"Jua",sans-serif;font-size:22px;border:3px solid var(--ink);border-radius:999px;padding:8px 18px;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:28px;color:#fff;text-shadow:2px 2px 0 var(--ink)}

/* 터치 조작 */
.touch{display:none}
.is-touch .touch{display:block}
.is-touch .keys{display:none}
#joy{position:absolute;left:0;bottom:0;width:45%;height:60%}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(27,35,80,.6);background:rgba(255,255,255,.35);display:none}
#joyKnob{position:absolute;width:54px;height:54px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);left:33px;top:33px}
.tbtns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:18px;grid-template-columns:repeat(2,72px);gap:12px}
.is-touch .tbtns{display:grid}
.tbtns button{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);font-family:"Jua",sans-serif;font-size:17px;box-shadow:3px 3px 0 var(--ink);background:var(--paper)}
.tbtns button:active,.tbtns button.down{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tbtns .b-kick{background:var(--pop);color:#fff}
.tbtns .b-grab{background:var(--sun)}
.tbtns .b-sit{background:var(--mint)}
.rotate{position:absolute;inset:0;display:none;place-items:center;background:var(--sky);z-index:20;font-family:"Jua",sans-serif;font-size:26px;text-align:center;padding:30px}
@media (orientation:portrait){ .is-touch .rotate.want{display:grid} }

/* 노래방 */
#game.kara{background:#1b2350}
#game.kara .keys,#game.kara .touch,#game.kara .tbtns,#game.kara .rotate,#game.kara .hud-top{display:none!important}
#kara{position:absolute;inset:0}
#kara canvas{display:block;width:100%;height:100%}
.k-tools{position:absolute;right:12px;top:66px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:4}
.k-tools .btn{font-size:15px}
.k-tools .mic{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px}
.k-tools .mic.on{background:var(--mint)}
.k-tools .mic.off{background:var(--sun)}
.tray{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end;z-index:4}
.kcard{width:110px;height:120px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);font-family:"Jua",sans-serif;font-size:16px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:6px;text-align:center}
.kcard .ci{font-size:32px}
.kcard:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.kcard:disabled{opacity:.4}
.lyric-in{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);display:flex;gap:8px;z-index:5;width:min(440px,92vw)}
.lyric-in .field{font-size:16px;padding:10px}
.k-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);color:#fff;font-weight:700;font-size:14px;text-align:center;width:min(560px,92vw);text-shadow:1px 1px 0 var(--ink)}
.songs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px;text-align:left}
.songbtn{font-size:17px;padding:12px;text-align:left;line-height:1.3}
.songbtn small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.guess{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px;text-align:left}
.guess li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:var(--r-small);padding:8px 10px;font-weight:700}
.guess select{font:inherit;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;background:#fff}
.rank{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px;text-align:left}
.rank li{display:flex;justify-content:space-between;background:var(--soft);border-radius:var(--r-small);padding:8px 12px;font-weight:700}
.kara .overlay .panel{max-height:88vh;overflow:auto}
.kara .overlay p{margin:6px 0}
#game.kara .feed{top:auto;bottom:150px}
.lyric-in.hidden,.tray.hidden,.k-tools .hidden{display:none}
.kcard.lyric-open{background:var(--sun)}
.kara .overlay .panel h3{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;margin:16px 0 4px;text-align:left}
.order{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.order span{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 10px 4px 4px;font-weight:700;font-size:14px}
.order .blob{width:24px;height:27px;border-width:2px}
.order .blob::before,.order .blob::after{top:8px;width:3px;height:5px}
.order .blob::before{left:5px}.order .blob::after{right:5px}
.ok{color:#0f8a5f}.no{color:#d6204f}

@media (max-width:820px){
  .kcard{width:88px;height:98px;font-size:13px}
  .kcard .ci{font-size:26px}
  .songs{grid-template-columns:1fr}
  .main-wrap{grid-template-columns:1fr;gap:28px;padding-top:64px}
  .lobby-grid{grid-template-columns:1fr}
  .lobby-head{padding-right:0;padding-top:44px}
  .code span.tile{font-size:32px;width:46px;height:54px}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){
  .title span{animation:none}
  .title span.squish{animation:none}
  .banner.bump,.feed div{animation:none}
}
</style>
</head>
<body>

<div class="sound" id="sound">
  <button id="muteBtn" aria-label="배경음 끄기">🔊</button>
  <input id="vol" type="range" min="0" max="1" step="0.05" aria-label="음량">
</div>

<!-- 메인 -->
<section class="screen on" id="main">
  <div class="main-wrap">
    <div>
      <h1 class="title" id="title" aria-label="오메가기문"></h1>
      <p class="tagline">친구들이랑 링크 하나로 바로 들어와서 같이 하는 개웃긴 게임 모음이에요. PC랑 폰 둘 다 돼요.</p>
      <div class="panel join">
        <div>
          <label class="lbl" for="nick">닉네임</label>
          <input class="field" id="nick" maxlength="12" placeholder="친구들이 부를 이름" autocomplete="off">
        </div>
        <div>
          <span class="lbl">내 캐릭터 색</span>
          <div class="swatches" id="swMain"></div>
        </div>
        <button class="btn pop" id="createBtn">방 만들기</button>
        <p class="or">또는 친구한테 받은 방 코드로</p>
        <div class="join-row">
          <input class="field" id="codeIn" maxlength="4" placeholder="ABCD" autocomplete="off" aria-label="방 코드">
          <button class="btn" id="joinBtn">입장</button>
        </div>
        <p class="err" id="mainErr" role="alert"></p>
      </div>
    </div>
    <div class="shelf">
      <h2>수록 게임</h2>
      <ul class="tickets" id="shelf"></ul>
    </div>
  </div>
</section>

<!-- 대기실 -->
<section class="screen" id="lobby">
  <div class="lobby-wrap">
    <div class="lobby-head">
      <div class="code"><span class="cap">방 코드</span><span id="codeTiles" style="display:flex;gap:8px"></span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn small mint" id="copyBtn">초대 링크 복사</button>
        <button class="btn small plain" id="leaveBtn">나가기</button>
      </div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h2 id="pcount">참가자</h2>
        <ul class="plist" id="plist"></ul>
        <div class="botctl hostonly">
          <span style="font-weight:700">봇</span>
          <button class="btn small plain" id="botMinus" aria-label="봇 빼기">빼기</button>
          <button class="btn small" id="botPlus" aria-label="봇 추가">추가</button>
        </div>
        <div class="mine">
          <span class="lbl">내 캐릭터 색</span>
          <div class="swatches" id="swLobby"></div>
        </div>
      </div>
      <div class="panel">
        <h2>게임 고르기</h2>
        <ul class="tickets" id="pickList"></ul>
        <label class="toggle"><input type="checkbox" id="evToggle" checked> 라운드마다 랜덤 이벤트 (얼음 바닥, 도망가는 의자, 바람)</label>
        <div class="start-area">
          <button class="btn pop hostonly" id="startBtn">게임 시작</button>
          <span class="wait" id="waitMsg"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="hidden">
  <div class="loading" id="loading">불러오는 중…</div>
  <div class="hud-top">
    <div class="banner" id="banner"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="keys" id="keys">
    <kbd>WASD</kbd> 이동 &nbsp; <kbd>Space</kbd> 점프 &nbsp; <kbd>E</kbd> 앉기/일어나기<br>
    <kbd>클릭</kbd> 잡기·던지기 &nbsp; <kbd>우클릭</kbd> 발차기 &nbsp; (<kbd>Q</kbd> 잡기 <kbd>F</kbd> 발차기)
  </div>
  <button class="btn small plain gbtn" id="quitBtn">나가기</button>
  <div class="touch" id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div class="touch tbtns">
    <button class="b-grab" data-act="grab">잡기</button>
    <button class="b-kick" data-act="kick">차기</button>
    <button class="b-sit" data-act="sit">앉기</button>
    <button class="b-jump" data-act="jump">점프</button>
  </div>
  <div class="replay-tag hidden" id="replayTag">다시보기</div>
  <div class="overlay hidden" id="endOv">
    <div class="panel">
      <h2 id="endTitle"></h2>
      <ul class="awards" id="awards"></ul>
      <button class="btn pop hostonly" id="backBtn">대기실로 돌아가기</button>
      <p class="wait" id="endWait"></p>
    </div>
  </div>
  <div class="rotate" id="rotate">폰을 가로로 돌려주세요</div>
</section>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

let AC = null, master = null;
function audioUnlock() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.connect(AC.destination);
    } catch (e) {}
  }
  if (AC && AC.state === 'suspended') AC.resume();
  bgmSync();
}
['pointerdown', 'keydown', 'touchstart'].forEach((ev) => window.addEventListener(ev, audioUnlock, { passive: true }));
// 게임 소리(효과음, 의자 뺏기 음악, 노래방 반주)는 메인 배경음 설정과 상관없이 항상 나와요
function sfxVol() { return 0.8; }

function tone(freq, dur, type = 'square', gain = 0.15, slide = 0, when = 0) {
  if (!AC) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(gain * sfxVol(), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, gain = 0.2, f0 = 1200, f1 = 300, q = 1) {
  if (!AC) return;
  const t = AC.currentTime;
  const buf = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate);
  const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(gain * sfxVol(), t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const SFX = {
  kick() { tone(140, 0.18, 'sine', 0.5, 0.4); noise(0.08, 0.25, 900, 200); },
  boing() { tone(220, 0.25, 'triangle', 0.18, 2.6); },
  ouch() { const f = rand(500, 800); tone(f, 0.35, 'square', 0.1, 0.35); },
  zap() { for (let i = 0; i < 5; i++) tone(rand(700, 1400), 0.05, 'sawtooth', 0.08, 1, i * 0.04); },
  sit() { tone(330, 0.08, 'square', 0.12); tone(660, 0.12, 'square', 0.12, 1, 0.07); },
  lock() { tone(523, 0.1, 'triangle', 0.18); tone(784, 0.18, 'triangle', 0.18, 1, 0.09); },
  whoosh() { noise(0.3, 0.25, 400, 2400, 2); },
  scratch() { noise(0.45, 0.4, 3000, 200, 3); tone(400, 0.4, 'sawtooth', 0.12, 0.2); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'square', 0.12, 1, i * 0.13)); },
  pop() { tone(900, 0.06, 'sine', 0.2, 0.5); },
};

// 의자 뺏기 음악 (직접 만든 서커스풍 멜로디)
const MEL = [0,4,7,4,12,11,9,7, 5,9,12,9,5,4,2,0, 7,11,14,11,7,5,4,2, 4,2,0,-99,0,-99,7,-99,
             0,0,4,4,7,7,12,-99, 9,9,5,5,9,12,9,5, 7,9,11,12,14,12,11,7, 12,7,4,7,0,-99,0,-99];
const CHORD = [0, 5, 7, 0, 0, 5, 7, 0];
const music = {
  on: false, step: 0, next: 0, bpm: 150, timer: null,
  start(bpm) {
    if (!AC) return;
    this.stop(); this.on = true; this.bpm = bpm; this.step = 0; this.next = AC.currentTime + 0.05;
    this.timer = setInterval(() => this.tick(), 40);
  },
  stop() { this.on = false; clearInterval(this.timer); this.timer = null; },
  tick() {
    if (!AC || !this.on) return;
    const spb = 60 / this.bpm / 2;
    while (this.next < AC.currentTime + 0.15) {
      const st = this.step % 64, bar = Math.floor(st / 8), w = this.next - AC.currentTime;
      const m = MEL[st];
      if (m > -50) tone(523.25 * Math.pow(2, m / 12), spb * 0.9, 'square', 0.07, 1, w);
      const root = 130.81 * Math.pow(2, CHORD[bar] / 12);
      if (st % 2 === 0) tone(root * (st % 4 === 0 ? 1 : 1.5), spb * 0.8, 'triangle', 0.22, 1, w);
      else { tone(root * 2 * Math.pow(2, 4 / 12), spb * 0.5, 'square', 0.035, 1, w); tone(root * 3, spb * 0.5, 'square', 0.035, 1, w); }
      this.next += spb; this.step++;
    }
  },
};

const net = {
  ws: null, room: null, players: [], hostId: null, retry: 0, leaving: false, ping: null,
  raw(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); },
  bcast(d) { this.raw({ t: 'b', d }); },
  to(id, d) { if (id === myId) onData(myId, d); else this.raw({ t: 'to', to: id, d }); },
  toHost(d) { if (isHost()) onData(myId, d); else this.raw({ t: 'h', d }); },
};
const isHost = () => net.hostId === myId;

function joinRoom(code) {
  $('#mainErr').textContent = '';
  net.room = code; net.leaving = false; net.retry = 0;
  history.replaceState(null, '', '?room=' + code);
  connect();
}
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const q = new URLSearchParams({ id: myId, name: profile.name, color: profile.color });
  let ws;
  try { ws = new WebSocket(`${proto}://${location.host}/ws/${net.room}?${q}`); }
  catch (e) { $('#mainErr').textContent = '서버에 연결하지 못했어요.'; return; }
  net.ws = ws;
  ws.onmessage = (ev) => {
    if (ev.data === 'pong') return;
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.k === 'welcome' || m.k === 'roster') onRoster(m);
    else if (m.k === 'full') { $('#mainErr').textContent = '방이 꽉 찼어요. (최대 8명)'; net.leaving = true; }
    else if (m.k === 'm') onData(m.f, m.d);
  };
  ws.onopen = () => {
    net.retry = 0;
    clearInterval(net.ping); net.ping = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 25000);
  };
  ws.onclose = () => {
    if (net.ws !== ws) return;
    clearInterval(net.ping);
    if (net.leaving) return;
    if (net.retry++ < 5) { toast('연결이 끊겨서 다시 붙는 중이에요…'); setTimeout(connect, 1200); }
    else { leaveRoom(); $('#mainErr').textContent = '연결이 계속 끊겨요. 잠시 뒤 다시 들어와 주세요.'; }
  };
}
function leaveRoom() {
  net.leaving = true;
  if (game) { game.destroy(); game = null; }
  try { net.ws && net.ws.close(); } catch (e) {}
  net.ws = null; net.room = null; net.players = []; net.hostId = null;
  history.replaceState(null, '', location.pathname);
  show('main');
}
$('#leaveBtn').onclick = leaveRoom;
$('#quitBtn').onclick = leaveRoom;

  setTimeout(() => $('#copyBtn').textContent = '초대 링크 복사', 1500);
};

let lobbyState = { game: 'chair', events: true, bots: [] };
let firstRoster = true;

function onRoster(m) {
  const wasHost = isHost();
  const prevIds = new Set(net.players.map((p) => p.id));
  net.players = m.players; net.hostId = m.hostId;
  if (m.k === 'welcome') {
    firstRoster = true;
    if (!game) show('lobby');
    if (!isHost()) net.toHost({ k: 'hello' });
  }
  if (isHost()) {
    if (!wasHost && game) { endGameAll(); toast('방장이 나가서 대기실로 돌아왔어요.'); }
    const joined = m.players.some((p) => !prevIds.has(p.id) && p.id !== myId);
    if (joined || !wasHost) net.bcast({ k: 'lobby', ...lobbyState });
  }
  if (game) game.onRoster();
  renderLobby();
}

function onData(from, d) {
  switch (d.k) {
    case 'hello':
      if (!isHost()) return;
      net.to(from, { k: 'lobby', ...lobbyState });
      if (game) net.to(from, { k: 'sync', game: game.kind, roster: game.rosterInfo(), opts: game.opts });
      return;
    case 'lobby':
      if (from !== net.hostId) return;
      lobbyState = { game: d.game, events: d.events, bots: d.bots || [] };
      renderLobby(); return;
    case 'start':
      if (from !== net.hostId) return;
      startGame(d.roster, d.opts, false, d.game); return;
    case 'sync':
      if (!game) startGame(d.roster, d.opts, true, d.game); return;
    case 'toLobby':
      if (from !== net.hostId && from !== myId) return;
      stopGame(); return;
    default:
      if (game) game.onData(from, d);
  }
}

function renderLobby() {
  if (!net.room) return;
  $('#codeTiles').innerHTML = [...net.room].map((c) => `<span class="tile">${c}</span>`).join('');
  const host = isHost();
  document.querySelectorAll('.hostonly').forEach((el) => el.classList.toggle('hidden', !host));
  const rows = net.players.map((p) => `<li><span class="blob" style="--c:${p.color}"></span><span class="nm">${esc(p.name)}</span>
     ${p.id === net.hostId ? '<span class="pill">방장</span>' : ''}${p.id === myId ? '<span class="pill me">나</span>' : ''}</li>`);
  lobbyState.bots.forEach((b) => rows.push(`<li><span class="blob" style="--c:${b.color}"></span><span class="nm">${esc(b.name)}</span><span class="pill bot">봇</span></li>`));
  $('#plist').innerHTML = rows.join('');
  const total = net.players.length + lobbyState.bots.length;
  $('#pcount').textContent = `참가자 ${total}명`;
  $('#pickList').innerHTML = GAMES.map((g) => `<li class="ticket ${g.live ? 'pick' : 'soon'}" data-g="${g.id}" aria-pressed="${g.id === lobbyState.game}" ${g.live && host ? 'tabindex="0" role="button"' : ''}>${ticketHTML(g)}</li>`).join('');
  $('#pickList').querySelectorAll('.ticket.pick').forEach((li) => {
    const pick = () => { if (!isHost()) return; lobbyState.game = li.dataset.g; hostLobbyChanged(); };
    li.onclick = pick; li.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  $('#evToggle').closest('label').classList.toggle('hidden', lobbyState.game !== 'chair');
  $('#evToggle').checked = !!lobbyState.events;
  $('#evToggle').disabled = !host;
  $('#startBtn').disabled = total < 2;
  $('#waitMsg').textContent = host
    ? (total < 2 ? '친구를 부르거나 봇을 추가하면 시작할 수 있어요.' : '')
    : '방장이 시작하길 기다리는 중이에요.';
  $('#botPlus').disabled = total >= 8; $('#botMinus').disabled = lobbyState.bots.length === 0;
}
function hostLobbyChanged() { renderLobby(); net.bcast({ k: 'lobby', ...lobbyState }); }
$('#botPlus').onclick = () => {
  if (!isHost() || net.players.length + lobbyState.bots.length >= 8) return;
  const used = new Set(lobbyState.bots.map((b) => b.name));
  const name = BOT_NAMES.find((n) => !used.has(n)) || '봇';
  lobbyState.bots.push({ id: 'bot_' + Math.random().toString(36).slice(2, 7), name, color: COLORS[(lobbyState.bots.length * 3 + 2) % COLORS.length] });
  hostLobbyChanged();
};
$('#botMinus').onclick = () => { if (isHost()) { lobbyState.bots.pop(); hostLobbyChanged(); } };
$('#evToggle').onchange = (e) => { if (isHost()) { lobbyState.events = e.target.checked; hostLobbyChanged(); } };
$('#startBtn').onclick = () => {
  if (!isHost()) return;
  const roster = net.players.map((p) => ({ id: p.id, name: p.name, color: p.color, bot: false }))
    .concat(lobbyState.bots.map((b) => ({ ...b, bot: true })));
  if (roster.length < 2) return;
  if (!roster.some((r) => !r.bot)) return;
  const opts = { events: lobbyState.events };
  net.bcast({ k: 'start', game: lobbyState.game, roster, opts });
  startGame(roster, opts, false, lobbyState.game);
};
$('#backBtn').onclick = () => endGameAll();

function toast(msg) {
  const f = $('#feed');
  if (!$('#game').classList.contains('hidden')) {
    const d = document.createElement('div'); d.textContent = msg; f.prepend(d);
    setTimeout(() => d.remove(), 4000); while (f.children.length > 5) f.lastChild.remove();
  } else { $('#mainErr').textContent = msg; $('#waitMsg') && ($('#waitMsg').textContent = msg); }
}

let game = null;
function startGame(roster, opts, late, kind) {
  if (game) game.destroy();
  show('game');
  gameEl.classList.toggle('kara', kind === 'karaoke');
  game = kind === 'karaoke' ? new KaraokeGame(roster, opts, late) : new ChairGame(roster, opts, late);
}
function stopGame() {
  if (game) { game.destroy(); game = null; }
  if (net.room) show('lobby');
  renderLobby();
}
function endGameAll() { if (isHost()) net.bcast({ k: 'toLobby' }); stopGame(); }

const input = { keys: new Set(), mx: 0, my: 0, edge: { jump: 0, kick: 0, grab: 0, sit: 0 }, joyX: 0, joyY: 0 };
window.addEventListener('keydown', (e) => {
  if (!game || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (!input.keys.has(k)) {
    if (k === ' ') input.edge.jump = 1;
    if (k === 'e') input.edge.sit = 1;
    if (k === 'f') input.edge.kick = 1;
    if (k === 'q') input.edge.grab = 1;
  }
  input.keys.add(k);
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', (e) => input.keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => input.keys.clear());
const gameEl = $('#game');
gameEl.addEventListener('contextmenu', (e) => e.preventDefault());
gameEl.addEventListener('mousedown', (e) => {
  if (!game || e.target.closest('button')) return;
  if (e.button === 0) input.edge.grab = 1;
  if (e.button === 2) input.edge.kick = 1;
});
document.querySelectorAll('.tbtns button').forEach((b) => {
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); input.edge[b.dataset.act] = 1; b.classList.add('down'); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => b.addEventListener(ev, () => b.classList.remove('down')));
});
(() => {
  const joy = $('#joy'), base = $('#joyBase'), knob = $('#joyKnob');
  let pid = null, cx = 0, cy = 0;
  joy.addEventListener('pointerdown', (e) => {
    pid = e.pointerId; joy.setPointerCapture(pid);
    const r = joy.getBoundingClientRect(); cx = e.clientX; cy = e.clientY;
    base.style.display = 'block'; base.style.left = (cx - r.left - 60) + 'px'; base.style.top = (cy - r.top - 60) + 'px';
  });

  onOuch(o) {
    const vic = this.chars.get(o.id), by = this.chars.get(o.by);
    const vn = vic ? vic.name : '누군가', bn = by ? by.name : '';
    const txt = {
      kick: `${bn}님이 ${vn}님을 걷어찼어요`, chair: `${bn}님이 의자로 ${vn}님을 날렸어요`,
      pull: `${bn}님이 ${vn}님을 의자에서 끌어냈어요`, yank: `${bn}님이 ${vn}님을 잡아당겼어요`,
      cushion: `관중 ${bn}님의 쿠션 공격!`, slip: `${vn}님이 바나나를 밟았어요`,
      zap: `${vn}님 찌릿! 의자 근처에서 서성이면 안 돼요`, fall: `${vn}님이 무대 밖으로 떨어졌어요`,
    }[o.kind];

    if ((this.phase === 'scramble' || this.phase === 'music') && o.mag > 6 && (!this.bestHit || o.mag >= this.bestHit.mag)) this.bestHit = { t: this.time, id: o.id, mag: o.mag, by: o.by, kind: o.kind };
  }

  // ---- 의자 ----
  makeChair(id) {
    const g = new THREE.Group();
    const wood = new THREE.MeshStandardMaterial({ color: 0xc98a52, roughness: 0.7 });
    const cush = new THREE.MeshStandardMaterial({ color: 0xff4f8b, roughness: 0.5, emissive: 0x000000 });
    const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
    add(new THREE.BoxGeometry(0.52, 0.06, 0.52), wood, 0, 0.04, 0);
    add(new THREE.BoxGeometry(0.46, 0.06, 0.46), cush, 0, 0.09, 0.01);
    const lg = new THREE.BoxGeometry(0.05, 0.42, 0.05);
    for (const [x, z] of [[-0.22, -0.22], [0.22, -0.22], [-0.22, 0.22], [0.22, 0.22]]) add(lg, wood, x, -0.19, z);
    add(new THREE.BoxGeometry(0.05, 0.5, 0.05), wood, -0.22, 0.32, -0.22); add(new THREE.BoxGeometry(0.05, 0.5, 0.05), wood, 0.22, 0.32, -0.22);
    add(new THREE.BoxGeometry(0.5, 0.22, 0.05), cush, 0, 0.47, -0.22);
    this.scene.add(g);
    const body = new CANNON.Body({ mass: 4, material: this.chairMat, collisionFilterGroup: GR.CHAIR, collisionFilterMask: GR.ENV | GR.CHAR | GR.RAG | GR.CHAIR | GR.REMOTE | GR.PROP });
    body.addShape(new CANNON.Box(new CANNON.Vec3(0.26, 0.235, 0.26)), new CANNON.Vec3(0, -0.165, 0));
    body.addShape(new CANNON.Box(new CANNON.Vec3(0.26, 0.2, 0.035)), new CANNON.Vec3(0, 0.37, -0.22));
    body.linearDamping = 0.1; body.angularDamping = 0.3; body.allowSleep = false;
    body.type = CANNON.Body.KINEMATIC;
    this.world.addBody(body);
    const c = { id, mesh: g, body, cush, occ: '', held: '', conf: 0, occT: 0, gone: false, thrownT: 0, tp: new V3(), tq: new Q(), init: false };
    this.chairs.set(id, c); return c;
  }
  removeChair(c) { this.scene.remove(c.mesh); this.world.removeBody(c.body); this.chairs.delete(c.id); }
  setChairType(c) {
    const kin = this.phase !== 'scramble' || c.occ || c.held || c.conf >= 100;
    const t = kin ? CANNON.Body.KINEMATIC : CANNON.Body.DYNAMIC;
    if (c.body.type !== t) { c.body.type = t; c.body.updateMassProperties(); c.body.wakeUp(); }
    if (kin) { c.body.velocity.set(0, 0, 0); c.body.angularVelocity.set(0, 0, 0); }
  }
  layoutChairs() {
    for (const c of [...this.chairs.values()]) this.removeChair(c);

    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, c = this.makeChair(this.nextChairId++);
      c.body.position.set(Math.cos(a) * R, 0.42, Math.sin(a) * R);
      const yaw = Math.atan2(Math.cos(a), Math.sin(a));
      c.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yaw);
    }
    this.ringR = R;
  }
  applyWorld(d) {
    const prevPhase = this.phase;
    this.tl = d.tl; this.round = d.rd; this.alive = d.al; this.event = d.ev; this.wind.set(d.wx || 0, 0, d.wz || 0);
    this.ringR = ringRadius(Math.max(1, d.al.length - 1));
    const seen = new Set();
    for (const a of d.ch) {
      const [id, x, y, z, qx, qy, qz, qw, occ, conf, held, gone] = a; seen.add(id);
      const c = this.chairs.get(id) || this.makeChair(id);
      c.tp.set(x / 100, y / 100, z / 100); c.tq.set(qx / 1000, qy / 1000, qz / 1000, qw / 1000).normalize();
      if (!c.init) { c.body.position.set(c.tp.x, c.tp.y, c.tp.z); c.body.quaternion.set(c.tq.x, c.tq.y, c.tq.z, c.tq.w); c.init = true; }
      const wasConf = c.conf >= 100;
      c.occ = occ; c.conf = conf; c.held = held; c.gone = !!gone;
      if (!wasConf && conf >= 100) SFX.lock();
    }
    for (const c of [...this.chairs.values()]) if (!seen.has(c.id)) this.removeChair(c);
    const ps = new Set();
    for (const a of d.pr) {
      const [id, type, x, y, z, qx, qy, qz, qw] = a; ps.add(id);
      let p = this.props.get(id); if (!p) p = this.makePropMesh(id, type);
      p.tp.set(x / 100, y / 100, z / 100); p.tq.set(qx / 1000, qy / 1000, qz / 1000, qw / 1000).normalize();
      if (!p.init) { p.mesh.position.copy(p.tp); p.init = true; }
    }
    for (const p of [...this.props.values()]) if (!ps.has(p.id)) this.removeProp(p);

  worldMsg() {
    const ch = [...this.chairs.values()].map((c) => {
      const p = c.body.position, q = c.body.quaternion;
      return [c.id, Math.round(p.x * 100), Math.round(p.y * 100), Math.round(p.z * 100), Math.round(q.x * 1000), Math.round(q.y * 1000), Math.round(q.z * 1000), Math.round(q.w * 1000), c.occ, Math.round(c.conf), c.held, c.gone ? 1 : 0];
    });
    const pr = [...this.props.values()].map((p) => {
      const b = p.body.position, q = p.body.quaternion;
      return [p.id, p.type, Math.round(b.x * 100), Math.round(b.y * 100), Math.round(b.z * 100), Math.round(q.x * 1000), Math.round(q.y * 1000), Math.round(q.z * 1000), Math.round(q.w * 1000)];
    });
    return { k: 'w', ph: this.phase, tl: Math.round(this.tl * 1000) / 1000, rd: this.round, al: this.alive, ev: this.event, wx: this.wind.x, wz: this.wind.z, ch, pr };
  }

  // ---- 관중 소품 ----
  makePropMesh(id, type) {
    const mesh = type === 'c'
      ? new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.18, 0.5), new THREE.MeshStandardMaterial({ color: 0xa678ff, roughness: 0.8 }))
      : new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.05, 6, 12, Math.PI * 1.2), new THREE.MeshStandardMaterial({ color: 0xffd23f, roughness: 0.5 }));
    mesh.castShadow = true; this.scene.add(mesh);
    const p = { id, type, mesh, tp: new V3(), tq: new Q(), init: false, life: type === 'c' ? 6 : 25 };
    this.props.set(id, p); return p;
  }
  spawnProp(type, pos, vel, by) {
    const p = this.makePropMesh(this.nextPropId++, type);
    const b = new CANNON.Body({ mass: type === 'c' ? 0.6 : 0.2, collisionFilterGroup: GR.PROP, collisionFilterMask: GR.ENV | GR.CHAIR | GR.PROP | GR.REMOTE | GR.CHAR });
    b.addShape(type === 'c' ? new CANNON.Box(new CANNON.Vec3(0.25, 0.09, 0.25)) : new CANNON.Box(new CANNON.Vec3(0.18, 0.04, 0.1)));
    b.position.set(pos.x, pos.y, pos.z); b.velocity.set(vel.x, vel.y, vel.z); b.angularVelocity.set(rand(-5, 5), rand(-5, 5), rand(-5, 5));
    b.linearDamping = 0.2; b.angularDamping = 0.5;
    this.world.addBody(b); p.body = b; p.by = by; p.hitSet = new Set();
  }
  removeProp(p) { this.scene.remove(p.mesh); if (p.body) this.world.removeBody(p.body); this.props.delete(p.id); }

  // ---- 진행 (방장) ----
  setPhase(ph, dur) {
    const prev = this.phase;
    this.phase = ph; this.tl = dur;
    if (ph === 'music') {
      this.round++;
      this.event = 'none';
      if (this.opts.events && this.round > 1 && Math.random() < 0.65) this.event = ['ice', 'runaway', 'wind'][Math.floor(Math.random() * 3)];
      const a = Math.random() * Math.PI * 2; this.wind.set(Math.cos(a) * 3.5, 0, Math.sin(a) * 3.5);
      this.layoutChairs();
    }
    for (const c of this.chairs.values()) this.setChairType(c);
    this.onPhase(ph, prev);
    net.bcast(this.worldMsg());
  }
  hostTick(dt) {
    this.tl -= dt;
    const ph = this.phase;
    if (ph === 'intro' && this.tl <= 0) this.setPhase('music', rand(7, 13));
    else if (ph === 'music' && this.tl <= 0) this.setPhase('scramble', 15);
    else if (ph === 'scramble') {
      const live = [...this.chairs.values()].filter((c) => !c.gone);
      for (const c of live) {
        if (c.occ) {
          const oc = this.chars.get(c.occ);
          if (!oc || (oc.local ? oc.rag : oc.remoteRag)) { c.occ = ''; c.occT = 0; c.conf = 0; this.setChairType(c); continue; }
          if (c.conf < 100) { c.occT += dt; c.conf = Math.min(100, (c.occT / 3) * 100); if (c.conf >= 100) { SFX.lock(); this.setChairType(c); } }
        }
      }
      const allConf = live.length > 0 && live.every((c) => c.conf >= 100);
      const seatedIds = new Set(live.filter((c) => c.occ).map((c) => c.occ));
      const everyoneSeated = this.alive.every((id) => seatedIds.has(id));
      if (allConf || everyoneSeated || this.tl <= 0 || live.length === 0) {
        const out = this.alive.filter((id) => !seatedIds.has(id));
        if (out.length === this.alive.length) { this.lastOut = []; this.redo = true; }
        else { this.lastOut = out; this.redo = false; this.alive = this.alive.filter((id) => seatedIds.has(id)); }
        this.setPhase('result', this.bestHit && this.bestHit.mag > 6 ? 7 : 4);
        net.bcast({ k: 'out', ids: this.lastOut, redo: this.redo }); this.showOut(this.lastOut, this.redo);
      }
    } else if (ph === 'result' && this.tl <= 0) {
      if (this.alive.length <= 1) this.setPhase('end', 12);
      else this.setPhase('music', rand(6, 12));
    } else if (ph === 'end' && this.tl <= 0) endGameAll();

    // 의자 물리
    for (const c of this.chairs.values()) {
      if (c.gone) continue;
      if (c.held) {
        const h = this.chars.get(c.held);
        if (!h || (h.local ? h.rag : h.remoteRag)) { c.held = ''; this.setChairType(c); continue; }
        const f = new V3(Math.sin(h.heading), 0, Math.cos(h.heading));
        const tp = h.torso.clone().addScaledVector(f, 0.6); tp.y += 0.3;
        const id = 1 / Math.max(dt, 1 / 120);
        c.body.velocity.set((tp.x - c.body.position.x) * id * 0.5, (tp.y - c.body.position.y) * id * 0.5, (tp.z - c.body.position.z) * id * 0.5);
        const q = new Q().setFromAxisAngle(UP, h.heading + Math.PI);
        c.body.quaternion.set(q.x, q.y, q.z, q.w);
      }
      if (c.thrownT > 0) {
        c.thrownT -= dt;
        const v = c.body.velocity, sp = v.length();
        if (sp > 4) {
          for (const o of this.chars.values()) {
            if (o.id === c.thrownBy || o.spect || c.hitSet.has(o.id) || o.isDown() || o.seatConfirmed()) continue;
            if ((o.local ? o.seat : o.remoteSeat) === c.id) continue;
            const cp = c.body.position;
            if (Math.hypot(o.torso.x - cp.x, o.torso.y - (cp.y + 0.2), o.torso.z - cp.z) < 0.85) {
              c.hitSet.add(o.id);
              this.sendHit(o.id, { k: 'hit', target: o.id, by: c.thrownBy, kind: 'chair', imp: { x: v.x * 0.8, y: 5, z: v.z * 0.8 } });

            }

        }
      }
      if (this.event === 'runaway' && ph === 'scramble' && !c.occ && !c.held && c.id === this.runawayId) {

        if (this.runT <= 0) { this.runT = 0.9; const a = Math.random() * Math.PI * 2; c.body.velocity.set(Math.cos(a) * 3.2, 2.5, Math.sin(a) * 3.2); }
      }
      if (this.event === 'wind' && ph === 'scramble' && c.body.type === CANNON.Body.DYNAMIC) c.body.applyForce(new CANNON.Vec3(this.wind.x * 4, 0, this.wind.z * 4));

      if (p.life <= 0 || p.body.position.y < -6) { this.removeProp(p); continue; }
      if (p.type === 'c' && p.body.velocity.length() > 3) {
        for (const o of this.chars.values()) {
          if (o.spect || p.hitSet.has(o.id) || o.isDown() || o.seatConfirmed()) continue;
          if (o.torso.distanceTo(new V3(p.body.position.x, p.body.position.y, p.body.position.z)) < 0.7) {
            p.hitSet.add(o.id); const v = p.body.velocity;
            this.sendHit(o.id, { k: 'hit', target: o.id, by: p.by, kind: 'cushion', imp: { x: v.x * 0.5, y: 4, z: v.z * 0.5 } });
          }
        }
      }
    }
    this.worldT -= dt;
    if (this.worldT <= 0) { this.worldT = 1 / 12; net.bcast(this.worldMsg()); }
  }
  showOut(ids, redo) {
    if (redo) { this.setBanner('아무도 못 앉았어요! 다시!'); return; }
    const names = ids.map((id) => (this.chars.get(id) || {}).name || '?');
    this.setBanner(names.length ? `탈락: ${names.join(', ')}` : '탈락자 없음');
  }
  onPhase(ph, prev) {
    const me = this.chars.get(myId);
    if (ph === 'intro') { this.setBanner('의자 뺏기!'); }
    if (ph === 'music') {
      this.bestHit = null; this.frames = [];
      const n = this.alive.length;
      const R = (this.ringR || ringRadius(Math.max(1, n - 1))) + 1.6;
      for (const c of this.chars.values()) {
        if (!c.local) continue;
        const i = this.alive.indexOf(c.id);
        if (i < 0) { if (!c.spect) { c.spect = true; this.respawn(c, false); } continue; }
        const a = (i / n) * Math.PI * 2 + 0.3;
        c.teleport(Math.cos(a) * R, 0.6, Math.sin(a) * R, Math.atan2(-Math.sin(a), Math.cos(a)));
      }
      if (me && me.spect) this.setBanner('관중석에서 방해해요!');
      else this.setBanner('♪ 빙글빙글 돌아요');
      music.start(140 + this.round * 8);
      if (isHost() && this.event === 'runaway') { const ids = [...this.chairs.keys()]; this.runawayId = ids[Math.floor(Math.random() * ids.length)]; }
    }
    if (ph === 'scramble') { music.stop(); SFX.scratch(); this.setBanner('앉아!!!'); this.shake = 0.5; }
    if (ph === 'result') { music.stop(); this.startReplay(); }
    if (ph === 'end') {
      music.stop(); SFX.fanfare();
      const w = this.chars.get(this.alive[0]);
      this.setBanner(w ? `${w.name} 우승!` : '게임 끝!');
      this.showEnd(w);
    }
  }
  setBanner(t) { const b = $('#banner'); b.textContent = t; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  showEnd(w) {
    const st = Object.entries(this.stats);
    const top = (k) => st.reduce((a, b) => (b[1][k] > (a ? a[1][k] : 0) ? b : a), null);
    const awards = [];
    const k = top('kick'), c = top('chair'), d = top('down');
    if (k) awards.push(`<li><b>발차기왕</b>${esc(k[1].name)} (${k[1].kick}번 걷어참)</li>`);
    if (c) awards.push(`<li><b>의자 투척왕</b>${esc(c[1].name)} (${c[1].chair}번 명중)</li>`);
    if (d) awards.push(`<li><b>공중부양상</b>${esc(d[1].name)} (${d[1].down}번 날아감)</li>`);
    $('#endTitle').textContent = w ? `${w.name} 우승!` : '게임 끝!';
    $('#awards').innerHTML = awards.join('') || '<li>이번 판은 다들 얌전했어요.</li>';
    $('#endWait').textContent = isHost() ? '12초 뒤 자동으로 대기실로 돌아가요.' : '잠시 뒤 대기실로 돌아가요.';
    document.querySelectorAll('.hostonly').forEach((el) => el.classList.toggle('hidden', !isHost()));
    $('#endOv').classList.remove('hidden');
  }

  // ---- 슬로모션 다시보기 ----
  record(dt) {
    if (this.phase !== 'music' && this.phase !== 'scramble') return;
    this.recT -= dt; if (this.recT > 0) return; this.recT = 1 / 30;
    const f = { t: this.time, c: new Map(), ch: new Map() };
    for (const c of this.chars.values()) f.c.set(c.id, c.parts.map((p) => ({ p: p.p.clone(), q: p.q.clone() })));
    for (const c of this.chairs.values()) f.ch.set(c.id, { p: c.mesh.position.clone(), q: c.mesh.quaternion.clone() });
    this.frames.push(f);
    while (this.frames.length && this.frames[0].t < this.time - 20) this.frames.shift();
  }
  startReplay() {
    const h = this.bestHit;
    if (!h || h.mag <= 6 || this.frames.length < 10) return;
    const t0 = Math.max(this.frames[0].t, h.t - 0.6), t1 = Math.min(this.frames[this.frames.length - 1].t, h.t + 1.6);
    if (t1 - t0 < 0.8) return;
    this.replay = { t: t0, t0, t1, id: h.id, frames: this.frames.slice() };
    const v = this.chars.get(h.id);
    $('#replayTag').textContent = `다시보기: ${v ? v.name : ''}님의 비행`;
    $('#replayTag').classList.remove('hidden');
  }
  replayFrame() {
    const r = this.replay, fr = r.frames;
    let lo = 0, hi = fr.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (fr[m].t < r.t) lo = m + 1; else hi = m; }
    return fr[lo];
  }

  // ---- 봇 ----
  botInput(c, dt) {
    const b = this.bot[c.id] || (this.bot[c.id] = { ang: Math.random() * 6, react: 0, act: 0, tgt: null, throwT: rand(2, 5) });
    const inp = { x: 0, z: 0, jump: false, kick: false, grab: false, sit: false };
    const pos = c.body.position;
    const go = (x, z, s = 1) => { const dx = x - pos.x, dz = z - pos.z, l = Math.hypot(dx, dz); if (l > 0.15) { inp.x = dx / l * Math.min(1, l) * s; inp.z = dz / l * Math.min(1, l) * s; } if (l < 1.3 && l > 0.01) c.heading = Math.atan2(dx, dz); return l; };
    if (c.spect) {
      b.throwT -= dt; if (b.throwT <= 0) { b.throwT = rand(3, 7); if (Math.random() < 0.6) inp.grab = true; else inp.kick = true; }
      return inp;
    }
    b.act -= dt;
    const R = (this.ringR || 2) + 1.4;
    if (this.phase === 'music' || this.phase === 'intro') {

    if (type === 'lyric') {
      const b = this.beat(), L = this.song.lines;
      const cur = this.curLine(b);
      const started = L[cur] && L[cur][0].b <= b + 0.3;
      const target = started ? cur + 1 : cur;
      if (target < L.length) this.swaps[target] = text;
    }
    this.flashMsg = CARDS[type].fx; this.flashT = 1.8;
    SFX.pop();
  }
  fxCount(type) { return this.fxList.filter((f) => f.type === type).length; }
  keyShift() { return this.fxCount('key') * 3; }

  // ---- 반주 ----
  buildEvents() {
    const s = this.song, ev = [], bpb = s.bpb;
    for (let b = -4; b < 0; b++) ev.push({ b, t: 'click', acc: b === -4 });
    const T = Math.ceil(s.total);
    const chordAt = (b) => s.chords.find((c) => b >= c.b && b < c.b + c.d) || s.chords[s.chords.length - 1];
    for (let b = 0; b < T; b++) {
      const p = b % bpb, ch = chordNotes(chordAt(b).name);
      if (p === 0 || (bpb === 4 && p === 2)) { ev.push({ b, t: 'kick' }); ev.push({ b, t: 'bass', n: ch.root + (p === 2 ? 7 : 0) }); }
      if (bpb === 4 && (p === 1 || p === 3)) ev.push({ b, t: 'snare' });
      ev.push({ b, t: 'hat' }); ev.push({ b: b + 0.5, t: 'hat', soft: 1 });
      if (bpb === 3 ? p > 0 : (p === 1 || p === 3)) ev.push({ b, t: 'chord', ns: ch.notes });
      if (bpb === 4 && (p === 0 || p === 2)) ev.push({ b: b + 0.5, t: 'chord', ns: ch.notes, soft: 1 });
    }
    ev.sort((a, c) => a.b - c.b);
    this.evs = ev; this.evi = 0;
  }
  schedule() {
    if (this.ph !== 'sing' || !this.song || !AC) return;
    const now = this.beat(), bpsR = this.bps * this.rate, ahead = now + 0.15 * bpsR, k = this.keyShift();
    while (this.evi < this.evs.length && this.evs[this.evi].b < ahead) {
      const e = this.evs[this.evi++];
      if (e.b < now - 0.15) continue;
      const w = Math.max(0, (e.b - now) / bpsR), spb = 1 / bpsR;
      if (e.t === 'click') tone(e.acc ? 1760 : 1320, 0.06, 'square', 0.12, 1, w);
      else if (e.t === 'kick') tone(110, 0.18, 'sine', 0.45, 0.35, w);
      else if (e.t === 'snare') kNoise(w, 0.12, 0.2, 1800, 'bandpass');
      else if (e.t === 'hat') kNoise(w, 0.04, e.soft ? 0.04 : 0.07, 8000, 'highpass');
      else if (e.t === 'bass') tone(mtof(e.n + k), 0.8 * spb, 'triangle', 0.3, 1, w);
      else if (e.t === 'chord') for (const n of e.ns) tone(mtof(n + k), 0.45 * spb, 'triangle', e.soft ? 0.035 : 0.055, 1, w);
    }
    if (this.fxCount('tamb')) {
      if (this.tambB < now - 0.2) this.tambB = Math.ceil(now * 4) / 4;
      while (this.tambB < ahead) { const w = Math.max(0, (this.tambB - now) / bpsR); kNoise(w, 0.07, 0.22, 6500, 'highpass'); tone(rand(2400, 3200), 0.03, 'square', 0.03, 1, w); this.tambB += 0.25; }
    }
  }
  voiceSet(m) {
    if (!AC) return;
    if (!this.voice) {
      const o = AC.createOscillator(); o.type = 'sawtooth';
      const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400; f.Q.value = 5;
      const g = AC.createGain(); g.gain.value = 0;
      o.connect(f); f.connect(g); g.connect(master); o.start();
      this.voice = { o, g };
    }
    const t = AC.currentTime;
    if (m == null) this.voice.g.gain.setTargetAtTime(0, t, 0.03);
    else { this.voice.o.frequency.setTargetAtTime(mtof(m), t, 0.02); this.voice.g.gain.setTargetAtTime(0.08 * sfxVol(), t, 0.03); }
  }
  voiceStop() { if (this.voice) { try { this.voice.o.stop(); } catch (e) {} this.voice = null; } }

  // ---- 마이크 ----
  async ensureMic() {
    if (this.mic || this.micTried) { this.updateMic(); return; }
    this.micTried = true; this.updateMic();
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
      if (this.dead) { st.getTracks().forEach((t) => t.stop()); return; }
      audioUnlock();
      const src = AC.createMediaStreamSource(st), an = AC.createAnalyser(); an.fftSize = 2048; src.connect(an);
      this.mic = { st, an, buf: new Float32Array(2048) }; this.finger = false;
    } catch (e) { this.finger = true; }
    this.updateMic();
  }
  updateMic() {
    const t = this.mic ? '🎤 마이크 켜짐' : this.finger ? '👆 손가락 모드' : '🎤 마이크 연결 중…';
    this.el.mic.textContent = t; this.el.mic.className = 'mic ' + (this.mic ? 'on' : 'off') + (this.el.mic.classList.contains('hidden') ? ' hidden' : '');
    const l = document.getElementById('kMicLine');
    if (l) l.textContent = this.mic ? '마이크가 연결됐어요.' : this.finger ? '마이크를 쓸 수 없어서 손가락 모드로 불러요. 화면을 눌러 위아래로 움직이면 음이 나요.' : '마이크 권한을 허용해 주세요.';
  }

  // ---- 노래 판정 ----
  noteAt(b) {
    const N = this.song.notes;
    while (this.ni < N.length - 1 && N[this.ni].b + N[this.ni].d <= b) this.ni++;
    const n = N[this.ni];
    return n && b >= n.b && b < n.b + n.d ? n : null;
  }
  curLine(b) {
    const N = this.song.notes;
    const n = N.find((x) => x.b + x.d > b) || N[N.length - 1];
    return n.line;
  }
  laneM(y) {
    const L = this.lay; if (!L) return null;
    let yy = y - this.cv.getBoundingClientRect().top;
    if (this.fxCount('flip')) yy = L.top + L.bot - yy;
    return L.lo + (L.bot - yy) / (L.bot - L.top) * (L.hi - L.lo);
  }
  singInput(dt, b, n) {
    if (this.isBot(this.singer)) {
      if (!n) return null;
      if (Math.random() < 0.06 * dt * 60) this.botOff = Math.random() < 0.25 ? rand(-4, 4) : 0;
      if (this.botVoiced == null || Math.random() < 0.02) this.botVoiced = Math.random() < 0.9;
      return this.botVoiced ? n.m + this.keyShift() + (this.botOff || 0) + Math.sin(performance.now() / 90) * this.botErr : null;
    }
    if (this.finger) return this.fingerDown ? this.laneM(this.fingerY) : null;
    if (!this.mic) return null;
    this.pf = !this.pf;
    if (this.pf) {
      this.mic.an.getFloatTimeDomainData(this.mic.buf);
      const f = detectPitch(this.mic.buf, AC.sampleRate);
      const m = f > 0 ? 69 + 12 * Math.log2(f / 440) : null;
      this.mHist.push(m); if (this.mHist.length > 3) this.mHist.shift();
      const v = this.mHist.filter((x) => x != null).sort((a, c) => a - c);
      this.lastM = v.length >= 2 ? v[v.length >> 1] : null;
    }
    return this.lastM;
  }
  singFrame(dt) {
    const b = this.beat(), n = this.noteAt(b);
    const m = this.singInput(dt, b, n);
    let disp = null, h = 0;
    if (n) {
      const tgt = n.m + this.keyShift(); this.lastTgt = tgt; this.totT += dt;
      if (m != null) {
        let d = m - tgt; d = ((d % 12) + 18) % 12 - 6; disp = tgt + d;
        const ad = Math.abs(d);
        if (ad <= 1) { h = 2; this.hitT += dt; } else if (ad <= 2) { h = 1; this.hitT += dt * 0.5; }
      }
    } else if (m != null) { const ref = this.lastTgt ?? 64; let d = m - ref; d = ((d % 12) + 18) % 12 - 6; disp = ref + d; }
    this.acc = this.totT > 0 ? (this.hitT / this.totT) * 100 : 0; this.shownAcc = Math.round(this.acc);
    if (b >= 0) this.trail.push({ b, m: disp, h });
    const synth = this.isBot(this.singer) || this.finger;
    if (synth) this.voiceSet(disp);
    this.ksT -= dt;
    if (this.ksT <= 0) { this.ksT = 1 / 15; net.bcast({ k: 'ks', b: Math.round(b * 100) / 100, m: disp == null ? null : Math.round(disp * 10) / 10, h, a: this.shownAcc, syn: synth ? 1 : 0 }); }
    if (b >= this.song.total + 0.5 && !this.doneSent) {
      this.doneSent = true;
      if (this.isBot(this.singer)) this.finishSing(this.acc); else net.toHost({ k: 'kdone', acc: this.acc });
    }
  }

  // ---- 루프 ----
  loop(t) {
    if (this.dead) return;
    this.raf = requestAnimationFrame(this.loop);
    const dt = Math.min(0.05, (t - this.last) / 1000); this.last = t;
    if (isHost()) { this.hostTick(dt); if (this.dead) return; } else this.tl -= dt;
    if (this.ph === 'sing' && this.song) {
      const now = performance.now() / 1000;
      this.fxList = this.fxList.filter((f) => f.end > now);
      const want = Math.min(2.25, Math.pow(1.5, this.fxCount('tempo')));
      if (want !== this.rate) this.setRate(want);
      const iSing = this.singer === myId || (isHost() && this.isBot(this.singer));
      if (iSing) this.singFrame(dt);
      else if (performance.now() - this.lastKs > 350) this.voiceSet(null);
      const b = this.beat();
      while (this.trail.length && this.trail[0].b < b - 5) this.trail.shift();
    }
    this.flashT = Math.max(0, this.flashT - dt);
    this.draw();
  }
  draw() {
    const cv = this.cv, g = this.cx, dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#1b2350'; g.fillRect(0, 0, W, H);
    const T = performance.now() / 1000;
    ['#ff4f8b', '#ffd23f', '#33d69f', '#a678ff', '#4aa8f0'].forEach((c, i) => {
      const x = W * (0.5 + 0.42 * Math.sin(T * 0.3 + i * 1.7)), y = H * (0.45 + 0.35 * Math.cos(T * 0.23 + i * 2.3)), r = Math.max(W, H) * 0.22;
      const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c + '30'); gr.addColorStop(1, c + '00');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    });
    const small = H < 520;
    const font = (px) => `${px}px Jua, sans-serif`;
    const outline = (txt, x, y, px, fill, align = 'center', maxW) => {
      g.font = font(px); g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';
      g.lineWidth = Math.max(3, px / 7); g.strokeStyle = '#1b2350'; g.strokeText(txt, x, y, maxW); g.fillStyle = fill; g.fillText(txt, x, y, maxW);
    };
    const narrow = W < 600, hw = narrow ? W - 230 : W - 360;
    // 머리말
    if (this.singer) {
      outline(`🎤 ${this.nameOf(this.singer)}님의 무대`, W / 2, small ? 22 : 30, small || narrow ? 18 : 26, '#fff', 'center', hw);
      if (this.song) outline(this.song.title, W / 2, small ? 46 : 58, small || narrow ? 14 : 18, '#ffd23f', 'center', hw);
    }
    if (!this.song || this.ph !== 'sing') {
      outline('노래방 망치기', W / 2, H / 2, Math.min(64, W / 9), '#ff4f8b');
      return;
    }
    outline(`${this.shownAcc}%`, 18, small ? 28 : 36, small || narrow ? 24 : 36, this.shownAcc >= 70 ? '#33d69f' : this.shownAcc >= 40 ? '#ffd23f' : '#ff4f8b', 'left');
    g.font = '600 12px "IBM Plex Sans KR", sans-serif'; g.fillStyle = '#cfd6ff'; g.textAlign = 'left'; g.fillText('음정 정확도', 20, small ? 50 : 62);

    const s = this.song, now = this.beat(), shift = this.keyShift();
    const trayH = this.el.tray.classList.contains('hidden') ? (this.el.hint.textContent ? 44 : 20) : (small ? 112 : 142);
    const ly2 = H - trayH - (small ? 10 : 20), ly1 = small ? ly2 : ly2 - 46;
    const top = small ? 66 : 92, bot = ly1 - (small ? 32 : 44);
    const lo = s.lo - 3 + Math.min(0, shift), hi = s.hi + 3 + shift;
    this.lay = { top, bot, lo, hi };
    const yOf = (m) => bot - ((m - lo) / (hi - lo)) * (bot - top);
    const pxb = W / (small ? 6 : 8), px = W * 0.22, xOf = (b) => px + (b - now) * pxb;
    // 진행 막대
    g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(16, top - 12, W - 32, 5);
    g.fillStyle = '#ff4f8b'; g.fillRect(16, top - 12, (W - 32) * clamp(now / s.total, 0, 1), 5);

    g.save();
    if (this.fxCount('flip')) { g.translate(rand(-7, 7), top + bot + rand(-7, 7)); g.scale(1, -1); g.translate(0, 0); }
    // 음정 칸
    g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(0, top - 4, W, bot - top + 8);
    for (let m = Math.ceil(lo); m <= hi; m++) { g.fillStyle = m % 12 === 0 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.05)'; g.fillRect(0, yOf(m), W, 1); }
    const bh = Math.max(8, ((bot - top) / (hi - lo)) * 0.9);
    for (const n of s.notes) {
      const x0 = xOf(n.b), x1 = xOf(n.b + n.d);
      if (x1 < 0 || x0 > W) continue;
      const y = yOf(n.m + shift);
      g.fillStyle = n.b + n.d < now ? 'rgba(255,255,255,.25)' : n.b <= now ? '#ffd23f' : '#ffffff';
      g.beginPath(); g.roundRect(x0 + 1, y - bh / 2, Math.max(4, x1 - x0 - 2), bh, bh / 2); g.fill();
    }
    let prev = null;
    for (const p of this.trail) {
      if (p.m == null) { prev = null; continue; }
      const x = xOf(p.b), y = yOf(p.m), col = p.h === 2 ? '#33d69f' : p.h === 1 ? '#ffd23f' : '#ff4f8b';
      if (prev && x - prev.x < 30) { g.strokeStyle = col; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(prev.x, prev.y); g.lineTo(x, y); g.stroke(); }
      prev = { x, y };
    }
    g.fillStyle = '#ff4f8b'; g.fillRect(px - 1.5, top - 6, 3, bot - top + 12);
    const lp = this.trail[this.trail.length - 1];
    if (lp && lp.m != null && now - lp.b < 0.3) { g.fillStyle = '#fff'; g.beginPath(); g.arc(px, yOf(lp.m), 8, 0, Math.PI * 2); g.fill(); }
    g.restore();

    // 가사
    const L = s.lines, cl = this.curLine(now);
    const drawLine = (li, y, px2, current) => {
      if (li >= L.length) return;
      if (this.swaps[li] != null) { outline(this.swaps[li], W / 2, y, px2, '#ff4f8b'); return; }
      const parts = L[li].map((n) => ({ t: n.syl.endsWith('-') ? n.syl.slice(0, -1) : n.syl + ' ', on: current && n.b <= now }));
      g.font = font(px2); const full = parts.map((p) => p.t).join('').trimEnd();
      let x = W / 2 - g.measureText(full).width / 2;
      for (const p of parts) { outline(p.t, x, y, px2, p.on ? '#ffd23f' : '#ffffff', 'left'); g.font = font(px2); x += g.measureText(p.t).width; }
    };
    const lpx = Math.min(small ? 28 : 38, W / 16);
    drawLine(cl, ly1, lpx, true);
    if (!small) drawLine(cl + 1, ly2, lpx * 0.62, false);
    // 카운트다운, 효과 알림
    if (now < 0) outline(String(Math.ceil(-now)), W / 2, (top + bot) / 2, 90, '#ffd23f');
    if (this.flashT > 0) { g.globalAlpha = Math.min(1, this.flashT * 2); outline(this.flashMsg, W / 2, (top + bot) / 2, Math.min(48, W / 12), '#ff4f8b'); g.globalAlpha = 1; }
    if (this.fxCount('key')) outline(`키 +${shift}`, W - 18, top + 14, 18, '#ffd23f', 'right');
    if (this.rate > 1) outline(`템포 x${this.rate.toFixed(2)}`, W - 18, top + 38, 18, '#ffd23f', 'right');
  }
}

/* =============== 시작 =============== */
const qs = new URLSearchParams(location.search);
const qRoom = (qs.get('room') || '').toUpperCase();
if (/^[A-Z0-9]{4}$/.test(qRoom)) {
  $('#codeIn').value = qRoom;
  if (profile.name) joinRoom(qRoom); else { $('#mainErr').textContent = '닉네임을 적고 입장을 눌러주세요.'; $('#nick').focus(); }
}
window.__omg = { get game() { return game; }, net };
</script>
</body>
